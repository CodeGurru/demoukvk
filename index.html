<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Supervisor - WhatsApp Style Chat with Real Meters & Proofs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap');
    body {
      font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #0b141a;
    }
    .font-digital {
      font-family: 'Orbitron', monospace;
    }
    .wa-bg {
      background-color: #0b141a;
      background-image: radial-gradient(#1f2c34 1px, transparent 1px), radial-gradient(#1f2c34 1px, #0b141a 1px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }
    .chat-bubble-in {
      background-color: #202c33;
      color: #e9edef;
      border-radius: 0px 16px 16px 16px;
    }
    .chat-bubble-out {
      background-color: #005c4b;
      color: #e9edef;
      border-radius: 16px 0px 16px 16px;
    }
    .pulse-mic {
      animation: pulse-mic 1.5s infinite;
    }
    @keyframes pulse-mic {
      0% { box-shadow: 0 0 0 0 rgba(255, 196, 46, 0.8); }
      70% { box-shadow: 0 0 0 14px rgba(255, 196, 46, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 196, 46, 0); }
    }
    .gauge-needle {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 100px 100px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex flex-col h-screen max-w-lg mx-auto shadow-2xl overflow-hidden border-x border-slate-800">

  <!-- ================= TOP HEADER ================= -->
  <header class="bg-[#202c33] text-white px-3 py-2.5 flex items-center justify-between z-30 shadow border-b border-[#2a3942]">
    <div class="flex items-center gap-2.5">
      <button onclick="restartDemo()" class="text-slate-300 hover:text-white p-1 text-lg">←</button>
      <div class="relative">
        <div class="w-10 h-10 rounded-full bg-[#FFC42E] text-slate-950 flex items-center justify-center font-black text-xl shadow">
          🤖
        </div>
        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#202c33] rounded-full"></span>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="font-bold text-sm text-[#e9edef] leading-tight">AI सीनियर सुपरवाइजर</h1>
          <span class="bg-[#FFC42E] text-slate-950 text-[9px] font-extrabold px-1.5 py-0.2 rounded font-mono">BIJLI WALA</span>
        </div>
        <p id="headerStatus" class="text-[11px] text-[#00a884] font-medium flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> ऑनलाइन • वॉइस + विज़न + रियल मीटर
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btnTtsToggle" onclick="toggleAudioSpeech()" class="p-2 rounded-full hover:bg-slate-700/50 text-[#aebac1] hover:text-[#FFC42E] text-sm" title="आवाज़ चालू/बंद">
        🔊
      </button>
      <button onclick="restartDemo()" class="text-xs bg-[#111b21] hover:bg-slate-700 text-[#aebac1] border border-slate-700 px-2 py-1 rounded-lg font-bold" title="नया केस शुरू करें">
        🔄 रीसेट
      </button>
    </div>
  </header>

  <!-- ================= CHAT SCROLL AREA ================= -->
  <main id="chatMessages" class="flex-1 overflow-y-auto p-3.5 space-y-4 wa-bg text-xs">
    <!-- Messages injected dynamically by JS -->
  </main>

  <!-- ================= BOTTOM ACTION BAR ================= -->
  <footer class="bg-[#202c33] p-2 border-t border-[#2a3942] z-30">
    <!-- Dynamic Quick Action Chips -->
    <div id="quickChipsBar" class="flex items-center gap-1.5 overflow-x-auto pb-2 no-scrollbar text-xs">
      <!-- Injected dynamically -->
    </div>

    <!-- WhatsApp Style Input -->
    <div class="flex items-center gap-2">
      <button onclick="triggerCameraInput('general')" class="p-2.5 rounded-full text-[#8696a0] hover:text-white bg-[#111b21] border border-slate-700 flex items-center justify-center text-lg active:scale-95 transition" title="कैमरा से फोटो खींचें">
        📷
      </button>

      <div class="flex-1 relative flex items-center">
        <input type="text" id="userTextInput" onkeydown="if(event.key==='Enter') handleUserSendMessage()" placeholder="मैसेज लिखें या बोलें (जैसे: 50 PSI, डायग्राम)..." class="w-full bg-[#2a3942] text-[#e9edef] placeholder-[#8696a0] text-xs py-2.5 px-3.5 rounded-2xl focus:outline-none focus:ring-1 focus:ring-[#00a884]">
      </div>

      <button id="btnMic" onclick="toggleSpeechRecognition()" class="w-10 h-10 rounded-full bg-[#FFC42E] hover:bg-amber-400 active:scale-95 text-slate-950 flex items-center justify-center font-bold text-lg shadow-lg transition" title="बोलकर बताएं">
        🎤
      </button>

      <button onclick="handleUserSendMessage()" class="p-2.5 rounded-full text-[#00a884] hover:text-white bg-[#111b21] border border-slate-700 flex items-center justify-center text-base active:scale-95 transition" title="भेजें">
        ➤
      </button>
    </div>
  </footer>

  <!-- ================= CAMERA MODAL ================= -->
  <div id="cameraModal" class="fixed inset-0 bg-black/90 z-50 flex flex-col justify-between p-4 hidden">
    <div class="flex items-center justify-between text-white">
      <div class="flex items-center gap-2">
        <span class="text-xl">📷</span>
        <span id="camModalTitle" class="font-bold text-sm">कैमरा स्कैनर</span>
      </div>
      <button onclick="closeCameraModal()" class="text-slate-400 hover:text-white text-2xl font-bold">✕</button>
    </div>

    <div class="relative flex-1 my-3 bg-slate-950 rounded-2xl overflow-hidden flex items-center justify-center border-2 border-dashed border-[#FFC42E]">
      <video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover"></video>
      <div class="absolute inset-8 border-2 border-[#FFC42E] rounded-xl pointer-events-none flex flex-col justify-between p-3">
        <span id="camOverlayTag" class="text-[10px] bg-black/80 text-[#FFC42E] px-2 py-0.5 rounded font-mono font-bold self-start">
          [AI SCANNER: OBJECT TARGET]
        </span>
        <span id="camOverlayHint" class="text-[11px] text-white text-center bg-black/80 py-1 rounded font-bold">
          ऑब्जेक्ट को बॉक्स के बीच में रखें
        </span>
      </div>
    </div>

    <div class="flex items-center justify-around pb-2">
      <button onclick="switchCameraAngle()" class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold border border-slate-700">
        🔄 एंगल बदलें
      </button>
      <button onclick="captureCameraPhoto()" class="w-16 h-16 rounded-full bg-[#FFC42E] border-4 border-white text-slate-950 flex items-center justify-center text-2xl shadow-xl active:scale-95 transition">
        📸
      </button>
      <button id="btnDemoSnap" onclick="handleDemoSnapshot()" class="px-3 py-2 bg-slate-800 text-amber-300 rounded-xl text-xs font-bold border border-slate-700">
        ⚡ डेमो फोटो
      </button>
    </div>
  </div>

  <!-- ================= SCRIPT & INTERACTION ENGINE ================= -->
  <script>
    let speechEnabled = true;
    let cameraStream = null;
    let cameraFacing = 'environment';
    let currentStep = 1;
    let currentCameraContext = 'general'; // 'safety_proof', 'diagram_sheet', 'general'

    // Appliance & Diagnostics State
    let applianceData = {
      brand: "LG",
      ton: "1.5 Ton",
      type: "Inverter",
      format: "Split AC",
      gas: "R32",
      voltage: 220,
      amp: 3.8,
      psi: 40,
      safetyProofs: {
        mcb: false,
        capacitor: false,
        gloves: false
      },
      problem: ""
    };

    const chatContainer = document.getElementById('chatMessages');

    // Speech Synthesis
    function speak(text) {
      if (!speechEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'hi-IN';
      u.rate = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const hi = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));
      if (hi) u.voice = hi;
      window.speechSynthesis.speak(u);
    }

    function toggleAudioSpeech() {
      speechEnabled = !speechEnabled;
      document.getElementById('btnTtsToggle').innerText = speechEnabled ? "🔊" : "🔇";
      if (!speechEnabled) window.speechSynthesis.cancel();
    }

    // Speech Recognition
    function toggleSpeechRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert("माइक के लिए Google Chrome का उपयोग करें।");
        return;
      }
      const rec = new SR();
      rec.lang = 'hi-IN';
      const micBtn = document.getElementById('btnMic');
      micBtn.classList.add('pulse-mic');
      speak("मैं सुन रहा हूँ, बोलिए...");

      rec.onresult = (e) => {
        micBtn.classList.remove('pulse-mic');
        const transcript = e.results[0][0].transcript;
        document.getElementById('userTextInput').value = transcript;
        handleUserSendMessage();
      };
      rec.onerror = () => micBtn.classList.remove('pulse-mic');
      rec.onend = () => micBtn.classList.remove('pulse-mic');
      rec.start();
    }

    function scrollToBottom() {
      setTimeout(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 50);
    }

    function addAiMessage(htmlContent, voiceText = "") {
      const div = document.createElement('div');
      div.className = "flex gap-2 items-start max-w-[95%]";
      const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-[#FFC42E] text-slate-950 flex items-center justify-center font-bold text-sm flex-shrink-0 mt-0.5 shadow">
          🤖
        </div>
        <div class="chat-bubble-in p-3 shadow-md space-y-2.5 border border-[#2a3942] w-full">
          ${htmlContent}
          <div class="flex items-center justify-between text-[10px] text-[#8696a0] pt-1.5 border-t border-[#2a3942]/60">
            <span class="flex items-center gap-1 font-mono text-[#00a884] font-bold">AI Senior Supervisor ⚡</span>
            <div class="flex items-center gap-1.5">
              <span>${timeStr}</span>
              <button onclick="speak(\`${voiceText || ''}\`)" class="text-xs hover:text-white" title="सुने">🔊</button>
            </div>
          </div>
        </div>
      `;
      chatContainer.appendChild(div);
      scrollToBottom();
      if (voiceText) speak(voiceText);
    }

    function addUserMessage(text) {
      const div = document.createElement('div');
      div.className = "flex justify-end";
      const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      div.innerHTML = `
        <div class="chat-bubble-out p-3 shadow-md max-w-[85%] space-y-1">
          <p class="text-xs text-white leading-relaxed font-medium">${text}</p>
          <div class="flex items-center justify-end gap-1 text-[10px] text-green-200">
            <span>${timeStr}</span>
            <span>✓✓</span>
          </div>
        </div>
      `;
      chatContainer.appendChild(div);
      scrollToBottom();
    }

    function setQuickChips(chips) {
      const bar = document.getElementById('quickChipsBar');
      bar.innerHTML = "";
      chips.forEach(chip => {
        const btn = document.createElement('button');
        btn.className = "bg-[#2a3942] hover:bg-[#32434e] active:scale-95 text-[#e9edef] px-3 py-1.5 rounded-full whitespace-nowrap border border-[#3b4c56] font-medium flex items-center gap-1 shadow-sm transition";
        btn.innerHTML = chip.label;
        btn.onclick = chip.action;
        bar.appendChild(btn);
      });
    }

    // ================= STEP 1: ARRIVAL & AC NAMEPLATE PHOTO =================
    function initConversation() {
      chatContainer.innerHTML = "";
      currentStep = 1;

      addAiMessage(`
        <p class="font-extrabold text-sm text-[#FFC42E]">नमस्ते टेक्नीशियन भाई! 🙏</p>
        <p class="leading-relaxed">
          आप ग्राहक (रमेश कुमार, अयोध्या) के यहाँ पहुँच गए हैं। सबसे पहले <strong>AC के इंडोर/आउटडोर और नेमप्लेट की फोटो खींचें</strong>, साथ ही स्टेबलाइजर और सॉकेट भी चेक करें।
        </p>

        <div class="bg-[#111b21] p-3 rounded-xl border border-slate-700 space-y-2 mt-2">
          <div class="flex items-center justify-between">
            <span class="font-bold text-white text-xs flex items-center gap-1.5">
              <span>📸</span> एसी नेमप्लेट फोटो (AC Nameplate)
            </span>
            <span class="text-[10px] text-amber-400 bg-amber-950/70 border border-amber-600/50 px-2 py-0.5 rounded">अनिवार्य</span>
          </div>
          <p class="text-[11px] text-slate-400">नेमप्लेट की फोटो से ब्रांड, टन, मॉडल और गैस AI अपने-आप भर देगा।</p>
          <div class="flex gap-2 pt-1">
            <button onclick="triggerCameraInput('nameplate')" class="flex-1 py-2 bg-[#FFC42E] hover:bg-amber-400 text-slate-950 rounded-lg font-black text-xs flex items-center justify-center gap-1 shadow active:scale-95">
              📷 कैमरा खोलें
            </button>
            <button onclick="handlePhotoReceived('LG Dual Inverter 1.5T Nameplate')" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-bold text-xs border border-slate-600 active:scale-95">
              ⚡ सैंपल फोटो
            </button>
          </div>
        </div>
      `, "नमस्ते टेक्नीशियन भाई! आप ग्राहक के यहाँ पहुँच गए हैं। सबसे पहले AC की नेमप्लेट और स्टेबलाइजर की फोटो खींचें।");

      setQuickChips([
        { label: "📸 AC की फोटो खींची", action: () => handlePhotoReceived('LG Dual Inverter 1.5T Nameplate') },
        { label: "🔌 स्टेबलाइजर चेक किया (220V OK)", action: () => sendQuickText("स्टेबलाइजर की फोटो ले ली है, 220V सप्लाई चालू है।") },
        { label: "📱 रिमोट चालू है", action: () => sendQuickText("रिमोट का डिस्प्ले चालू है, बैटरी सही है।") }
      ]);
    }

    // ================= STEP 2: PHOTO DETECTED + EDITABLE FORM =================
    function handlePhotoReceived(photoLabel) {
      addUserMessage(`📸 [फोटो अपलोड: ${photoLabel}]`);

      setTimeout(() => {
        currentStep = 2;
        addAiMessage(`
          <div class="space-y-2.5">
            <div class="flex items-center justify-between text-[#FFC42E] font-bold">
              <span class="flex items-center gap-1">✨ AI विज़न ऑटो-डिटेक्ट:</span>
              <span class="text-green-400 text-[10px] bg-green-950 px-2 py-0.5 rounded border border-green-700 font-mono">CONFIDENCE 96%</span>
            </div>
            <p class="text-slate-300 text-[11px]">
              फोटो से ये डेटा पढ़ा गया है। अगर कोई वैल्यू गलत हो तो ड्रॉपडाउन से अभी बदल लें:
            </p>

            <div class="bg-[#111b21] p-3 rounded-xl border border-slate-700 space-y-2.5 text-xs">
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-slate-400 mb-0.5">ब्रांड (Brand):</label>
                  <select id="selBrand" onchange="applianceData.brand=this.value" class="w-full bg-[#202c33] text-white p-1.5 rounded-lg border border-slate-600 font-bold focus:outline-none">
                    <option value="LG" selected>LG</option>
                    <option value="Daikin">Daikin</option>
                    <option value="Voltas">Voltas</option>
                    <option value="Hitachi">Hitachi</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Lloyd">Lloyd</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] text-slate-400 mb-0.5">क्षमता (Capacity):</label>
                  <select id="selTon" onchange="applianceData.ton=this.value" class="w-full bg-[#202c33] text-white p-1.5 rounded-lg border border-slate-600 font-bold focus:outline-none">
                    <option value="1.0 Ton">1.0 Ton (12000 BTU)</option>
                    <option value="1.5 Ton" selected>1.5 Ton (18000 BTU)</option>
                    <option value="2.0 Ton">2.0 Ton (24000 BTU)</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-slate-400 mb-0.5">तकनीक (Type):</label>
                  <select id="selType" onchange="applianceData.type=this.value" class="w-full bg-[#202c33] text-white p-1.5 rounded-lg border border-slate-600 font-bold focus:outline-none">
                    <option value="Inverter" selected>Inverter (Dual)</option>
                    <option value="Non-Inverter">Non-Inverter</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] text-slate-400 mb-0.5">गैस (Refrigerant):</label>
                  <select id="selGas" onchange="applianceData.gas=this.value" class="w-full bg-[#202c33] text-white p-1.5 rounded-lg border border-slate-600 font-bold focus:outline-none">
                    <option value="R32" selected>R32 (Eco-Friendly)</option>
                    <option value="R410A">R410A</option>
                    <option value="R22">R22</option>
                  </select>
                </div>
              </div>

              <button onclick="confirmApplianceDetails()" class="w-full mt-2 py-2 bg-[#00a884] hover:bg-emerald-600 text-white rounded-lg font-black text-xs flex items-center justify-center gap-1 shadow active:scale-95">
                ✓ जानकारी सही है, सुरक्षा फाटक पर चलें
              </button>
            </div>
          </div>
        `, "नेमप्लेट से पहचान लिया है: LG 1.5 टन इनवर्टर, R32 गैस। अगर कुछ गलत हो तो ड्रॉपडाउन से बदलें और पुष्टि करें।");

        setQuickChips([
          { label: "✓ पुष्टि करें (Confirm)", action: () => confirmApplianceDetails() },
          { label: "🔄 दोबारा फोटो लें", action: () => triggerCameraInput('nameplate') }
        ]);
      }, 600);
    }

    // ================= STEP 3: SAFETY GATE WITH REAL PHOTO PROOF =================
    function confirmApplianceDetails() {
      addUserMessage(`✓ मैंने कन्फर्म कर लिया: ${applianceData.brand} ${applianceData.ton} ${applianceData.type}, गैस ${applianceData.gas}`);

      setTimeout(() => {
        currentStep = 3;
        addAiMessage(`
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <p class="font-extrabold text-[#FFC42E] flex items-center gap-1 text-sm">
                <span>🛡️</span> सुरक्षा फाटक (Safety Mandatory Check)
              </p>
              <span class="text-[10px] bg-red-950 text-red-300 border border-red-700 px-2 py-0.5 rounded font-bold">
                🔒 फोटो प्रूफ अनिवार्य
              </span>
            </div>

            <p class="text-slate-300 text-[11px] leading-relaxed">
              कंपनी नियम: AC का पैनल खोलने या तार छूने से पहले इन 3 सुरक्षा नियमों का <strong>फोटो सबूत (Photo Proof)</strong> देना जरूरी है:
            </p>

            <div class="bg-[#111b21] p-3 rounded-xl border border-red-500/50 space-y-3 text-xs">
              <!-- Safety 1 -->
              <div class="flex items-center justify-between p-2 bg-[#182229] rounded-lg border border-slate-700">
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="chkMcb" onchange="checkSafetyState()" class="w-4 h-4 accent-red-600">
                  <div>
                    <span class="text-white font-bold block">1. मुख्य MCB बंद की? ⚡</span>
                    <span class="text-[10px] text-slate-400">टेस्टर से 0V चेक करें</span>
                  </div>
                </div>
                <span id="proofBadgeMcb" class="text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded">प्रूफ नहीं मिला</span>
              </div>

              <!-- Safety 2 -->
              <div class="flex items-center justify-between p-2 bg-[#182229] rounded-lg border border-slate-700">
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="chkCap" onchange="checkSafetyState()" class="w-4 h-4 accent-red-600">
                  <div>
                    <span class="text-white font-bold block">2. कैपेसिटर डिस्चार्ज किया? 🧯</span>
                    <span class="text-[10px] text-slate-400">पेचकस से पिन शॉर्ट की</span>
                  </div>
                </div>
                <span id="proofBadgeCap" class="text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded">प्रूफ नहीं मिला</span>
              </div>

              <!-- Safety 3 -->
              <div class="flex items-center justify-between p-2 bg-[#182229] rounded-lg border border-slate-700">
                <div class="flex items-center gap-2">

    // Dynamic Meter Reactions with Real-time Speech
    let meterDebounce;
    function onLiveMeterInput(type, val) {
      clearTimeout(meterDebounce);
      val = parseFloat(val) || 0;

      if (type === 'psi') {
        applianceData.psi = val;
        // Map 0 to 250 PSI to -120 to +120 degrees
        const deg = -120 + (val / 250) * 240;
        const needle = document.getElementById('liveGaugeNeedle');
        if (needle) needle.style.transform = `rotate(${deg}deg)`;

        const fb = document.getElementById('psiFeedbackText');
        if (fb) {
          if (val > 300) {
            fb.className = "text-red-500 font-black text-[11px] bg-red-950 px-2 py-0.5 rounded border border-red-700";
            fb.innerText = `${val} PSI (अत्यधिक उच्च / खतरा!)`;
          } else if (val < 70) {
            fb.className = "text-red-400 font-black text-[11px] bg-red-950 px-2 py-0.5 rounded border border-red-700";
            fb.innerText = `${val} PSI (गैस बहुत कम!)`;
          } else if (val >= 115 && val <= 135) {
            fb.className = "text-green-400 font-black text-[11px] bg-green-950 px-2 py-0.5 rounded border border-green-700";
            fb.innerText = `${val} PSI (परफेक्ट प्रेशर)`;
          } else {
            fb.className = "text-amber-400 font-black text-[11px] bg-amber-950 px-2 py-0.5 rounded border border-amber-700";
            fb.innerText = `${val} PSI (हल्का कम है)`;
          }
        }

        meterDebounce = setTimeout(() => {
          if (val > 300) {
            speak(`आपने डाला ${val} PSI! ये रीडिंग बहुत ज्यादा या गलत है, कृपया मीटर वाल्व दोबारा चेक करें।`);
          } else if (val < 70) {
            speak(`आपने डाला ${val} PSI। R32 गैस के लिए ये बहुत कम है, लीकेज पक्की है।`);
          } else if (val >= 115 && val <= 135) {
            speak(`आपने डाला ${val} PSI। गैस का प्रेशर बिल्कुल सही है।`);
          } else {
            speak(`आपने डाला ${val} PSI। गैस थोड़ी कम है।`);
          }
        }, 350);

      } else if (type === 'amp') {
        applianceData.amp = val;
        const lcd = document.getElementById('clampLcdText');
        if (lcd) lcd.innerText = `${val.toFixed(1)} A`;
        const fb = document.getElementById('ampFeedbackText');
        if (fb) {
          if (val < 4.5) {
            fb.className = "text-amber-400 font-black text-[11px] bg-amber-950 px-2 py-0.5 rounded border border-amber-700";
            fb.innerText = `${val}A (लोड कम है)`;
          } else {
            fb.className = "text-green-400 font-black text-[11px] bg-green-950 px-2 py-0.5 rounded border border-green-700";
            fb.innerText = `${val}A (नॉर्मल लोड)`;
          }
        }
        meterDebounce = setTimeout(() => {
          speak(`करंट ${val} एम्पीयर दर्ज किया गया।`);
        }, 400);

      } else if (type === 'volt') {
        applianceData.voltage = val;
        const lcd = document.getElementById('voltLcdText');
        if (lcd) lcd.innerText = `${val} V`;
        meterDebounce = setTimeout(() => {
          speak(`वोल्टेज ${val} वोल्ट दर्ज किया गया।`);
        }, 400);
      }
    }

      if (inEl) {
        inEl.value = psiVal;
        onLiveMeterInput('psi', psiVal);

    }

    async function triggerCameraInput(context = 'general') {
      currentCameraContext = context;
      const modal = document.getElementById('cameraModal');
      const video = document.getElementById('cameraVideo');
      const title = document.getElementById('camModalTitle');
      const tag = document.getElementById('camOverlayTag');
      const hint = document.getElementById('camOverlayHint');

      if (context === 'safety_proof') {
        title.innerText = "सुरक्षा सबूत: MCB / ग्लव्स की फोटो लें";
        tag.innerText = "[SAFETY AUDIT SCANNER]";
        hint.innerText = "बंद MCB या दस्ताने पहने हाथ को बॉक्स में लाएं";
      } else if (context === 'diagram_sheet') {
        title.innerText = "वायरिंग या एरर कोड शीट स्कैन करें";
        tag.innerText = "[DIAGRAM SHEET PARSER]";
        hint.innerText = "AC के ढक्कन पर चिपके स्टिकर को बॉक्स में रखें";
      } else {
        title.innerText = "AC नेमप्लेट या मीटर स्कैन करें";
        tag.innerText = "[NAMEPLATE SCANNER]";
        hint.innerText = "नेमप्लेट को बॉक्स के बीच में रखें";
      }

      modal.classList.remove('hidden');

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: cameraFacing } },
          audio: false
        });
        video.srcObject = cameraStream;
      } catch (err) {
        console.warn("Camera fallback:", err);
      }
    }

    function closeCameraModal() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
      }
      document.getElementById('cameraModal').classList.add('hidden');
    }

          proceedToQuotation('general');
        } else {
          addAiMessage(`
            <p class="text-xs text-slate-200">
              मैंने नोट कर लिया: "<strong>${text}</strong>"। 
              कृपया नीचे दिए गए बटनों से अगला स्टेप चुनें:
            </p>
          `, text);
        }
      }, 400);
    }

    function restartDemo() {
      initConversation();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initConversation();
    });
  </script>
</body>
</html>
